<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Breaking Bad Brick</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04120a;
      }
      /* Mobile browsers size `100%` against the *large* viewport, so the
         canvas stays taller than the visible area while the URL bar is
         showing and the bottom of the court sits under browser chrome.
         `dvh` tracks the area actually on screen. */
      @supports (height: 100dvh) {
        html,
        body,
        #app {
          height: 100dvh;
        }
      }
      body {
        position: fixed;
        inset: 0;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      #app canvas {
        display: block;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
